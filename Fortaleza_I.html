<style>
:root{--bg:#08080f;--panel:#12121f;--panel-hi:#1a1a2e;--border:#2a2a3f;--border-hi:#3f3f5a;--text:#e0e0e8;--dim:#8888a0;--mute:#555570;--amber:#d4a24e;--amber-hi:#f0c46a;--green:#4ade80;--red:#f87171;--blue:#60a5fa;--purple:#c084fc;--font:"Iowan Old Style",Georgia,"Times New Roman",serif;--mono:Consolas,"Courier New",monospace;--ui:system-ui,-apple-system,sans-serif;--r:6px;--g:10px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;overflow:hidden}
.app{display:grid;grid-template-rows:48px 1fr 28px;height:100vh}
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:0 16px;background:linear-gradient(180deg,#14141f,#0e0e18);border-bottom:1px solid var(--border);font-family:var(--ui)}

.topbar__location{text-align:center;color:var(--dim);font-size:13px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar__tools{display:flex;gap:4px}

.board{display:grid;grid-template-columns:minmax(360px,1fr) minmax(380px,1.15fr) 260px;gap:var(--g);padding:var(--g);overflow:hidden;min-height:0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}

.room-desc{padding:10px 14px;font-size:13px;color:var(--dim);border-top:1px solid var(--border);font-style:italic;max-height:80px;overflow-y:auto}

.log__msg--cmd{color:var(--amber);font-family:var(--mono);font-size:13px;margin-top:0}
.log__msg--room{color:var(--text);font-weight:600;font-style:italic}
.log__msg--desc{color:var(--dim)}
.log__msg--success{color:var(--green)}
.log__msg--error{color:var(--red)}
.log__msg--hint{color:var(--blue);font-style:italic}

.quick{display:flex;gap:6px;padding:6px 12px 10px;border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none}

.modal__sub{color:var(--dim);text-align:center;font-style:italic;margin:0 0 20px;font-size:14px}
.modal__text{color:var(--dim);white-space:pre-wrap;font-family:var(--font);line-height:1.6;font-size:14px}
.modal__actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.btn{background:var(--panel-hi);border:1px solid var(--border-hi);color:var(--text);padding:8px 16px;border-radius:4px;cursor:pointer;font-family:var(--ui);font-size:13px;transition:all .15s}

/* ═══════════════════════════════════════════════════════════════
   UTILIDADES
   ═══════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const ARTICLES = new Set(['EL','LA','LOS','LAS','UN','UNA','POR','AL','DEL','DE']);

function norm(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim().toUpperCase();
}
function ncmp(s){
  return norm(s).split(' ').filter(w => w && !ARTICLES.has(w)).join(' ').toLowerCase();
}
const nwords = s => ncmp(s).split(' ').filter(Boolean);

function eqWords(a,b){
  const ta = nwords(a), tb = nwords(b);
  if (!ta.length || !tb.length) return false;
  return tb.every(t => ta.includes(t));
}

function shadeColor(hex, amt){
  const c = hex.replace('#','');
  const r = Math.max(0, Math.min(255, parseInt(c.slice(0,2),16) + amt));
  const g = Math.max(0, Math.min(255, parseInt(c.slice(2,4),16) + amt));
  const b = Math.max(0, Math.min(255, parseInt(c.slice(4,6),16) + amt));
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

const OL  = (id,name,desc,dest,pc)=>({id,t:'openlink',name,desc,dest,pc,_open:true});

/* ═══════════════════════════════════════════════════════════════
   ESTADO Y PUERTAS SINCRONIZADAS
   ═══════════════════════════════════════════════════════════════ */
const TOTAL_ROOMS = 50;
const MAX_WEIGHT  = 40;
let R, G, ARMED = null, history = [], histIdx = -1;

const CONNECTORS    = { dar:'a', matar:'con', romper:'con', abrir:'con' };
const TWO_REQUIRED  = ['dar'];
const TWO_OPTIONAL  = ['matar','romper','abrir'];
const INSTANT_VERBS = ['porciento','cls','ayuda'];
const CONFIRM_VERBS = ['terminar'];

const DOOR_TYPES = ['link','openlink','dangerlink','dangerlink2','riddlelink'];

function cloneObj(o){
  const c = {...o};
  if (c.reveals) c.reveals = cloneObj(c.reveals);
  return c;
}

function findReverseDoor(roomId, door){
  const destRoom = R[door.dest];
  if (!destRoom) return null;
  const candidates = destRoom.objs.filter(o =>
    DOOR_TYPES.includes(o.t) && o.dest === roomId
  );
  if (!candidates.length) return null;
  const nameMatch = candidates.find(o => ncmp(o.name) === ncmp(door.name));
  if (nameMatch) return nameMatch;
  return candidates.length === 1 ? candidates[0] : null;
}

function setDoorOpen(roomId, door, open){
  door._open = open;
  const reverse = findReverseDoor(roomId, door);
  if (reverse && reverse !== door) reverse._open = open;
}

function syncAllDoors(){
  // Propaga apertura en ambos sentidos: si un lado está abierto (o es openlink), el otro también.
  for (const roomId in R) {
    for (const obj of R[roomId].objs) {
      if (!DOOR_TYPES.includes(obj.t)) continue;
      if (obj.t === 'openlink' || obj._open) {
        const reverse = findReverseDoor(+roomId, obj);
        if (reverse && reverse !== obj && !reverse._open) {
          reverse._open = true;
        }
      }
    }
  }
}

function initGame(){
  R = {};
  for (const k in ROOMS) {
    const room = ROOMS[k];
    R[k] = {
      name: room.name, desc: room.desc, svg: room.svg,
      objs: room.objs.map(cloneObj)
    };
    for (const o of R[k].objs) {
      if (o.t==='openlink') o._open = true;
      else if (o.t==='link' || o.t==='riddlelink') o._open = false;
      else if (o.t==='dangerlink' || o.t==='dangerlink2') {
        o._open = (k==='18') || (o.id==='tunel24');
      }
    }
  }
  syncAllDoors();
  G = { curr:1, bag:[], visited:new Set([1]), dead:false };
  ARMED = null;
  history = []; histIdx = -1;
}

function log(msg, cls){
  const p = document.createElement('p');
  p.className = 'log__msg' + (cls ? ' log__msg--'+cls : '');
  p.textContent = msg;
  $('#log').appendChild(p);
  $('#log').scrollTop = 1e9;
}
function logSep(){
  const hr = document.createElement('hr');
  hr.className = 'log__sep';
  $('#log').appendChild(hr);
  $('#log').scrollTop = 1e9;
}
function clearLog(){ $('#log').innerHTML = ''; }

/* ═══════════════════════════════════════════════════════════════
   BÚSQUEDA
   ═══════════════════════════════════════════════════════════════ */
function findIn(list, name){
  if (!name) return null;
  const q = ncmp(name);
  if (!q) return null;
  const qWords = q.split(' ').filter(Boolean);
  for (const o of list) if (ncmp(o.name) === q) return o;
  let best = null, bestLen = 0;
  for (const o of list) {
    const w = nwords(o.name);
    if (w.length && w.every(t => qWords.includes(t)) && w.length > bestLen) { best = o; bestLen = w.length; }
  }
  if (best) return best;
  for (const o of list) {
    const w = nwords(o.name);
    if (w.length && qWords.every(t => w.includes(t))) return o;
  }
  return null;
}
const findInRoom = name => findIn(R[G.curr].objs, name);
const findInBag  = name => findIn(G.bag, name);

/* ═══════════════════════════════════════════════════════════════
   PARSER
   ═══════════════════════════════════════════════════════════════ */
const VERBS = {
  IR:'go',ATRAVESAR:'go',CRUZAR:'go',PASAR:'go',
  COGER:'take',TOMAR:'take',
  DEJAR:'drop',SOLTAR:'drop',
  ABRIR:'open',
  MATAR:'kill',ASESINAR:'kill',
  MIRAR:'look',OBSERVAR:'look',
  VER:'see',LEER:'see',
  ROMPER:'break',FORZAR:'break',DESTROZAR:'break',
  INTERROGAR:'ask',PREGUNTAR:'ask',
  INVENTARIO:'inv',
  DAR:'give',REGALAR:'give',
  PESAR:'weigh',
  PORCIENTO:'percent',
  SALVAR:'save',CARGAR:'load',
  EJECUTAR:'exec',
  TERMINAR:'quit',ABANDONAR:'quit',
  CLS:'cls',MIAR:'cls',ORINAR:'piss',
  AYUDA:'help'
};

function preprocess(s){
  return s
    .replace(/\bal\b/gi,'a')
    .replace(/\bpor\b/gi,'')
    .replace(/\b(el|la|los|las|un|una|del|de)\b/gi,'')
    .replace(/\s+/g,' ').trim();
}
function parse(input){
  const clean = preprocess(input);
  if (!clean) return {err:'vacio'};
  const parts = clean.split(/\s+/);
  const verb = VERBS[norm(parts[0])];
  const rest = parts.slice(1).join(' ').trim();
  return {verb, rest, raw:input};
}

/* ═══════════════════════════════════════════════════════════════
   APERTURA DE PUERTAS
   ═══════════════════════════════════════════════════════════════ */
function tryOpen(obj, key, roomId){
  if (obj.t === 'riddlelink') {
    if (key && ncmp(key) === ncmp(obj.answer)) {
      setDoorOpen(roomId, obj, true);
      log('Usted ha descifrado el acertijo correctamente.','success');
      return true;
    }
    if (!key) { log('Debe resolver este acertijo:','hint'); log(obj.riddle,'hint'); }
    else { log('Esa no es la respuesta.','error'); log(obj.riddle,'hint'); }
    return false;
  }
  if (!obj.key) { setDoorOpen(roomId, obj, true); return true; }
  if (ncmp(key) === ncmp(obj.key)) { setDoorOpen(roomId, obj, true); return true; }
  log('Usted trata de abrir, pero no puede lograrlo.','error');
  if (!key) log('Necesita unas palabras mágicas.','hint');
  else log(`«${key}» no es la contraseña.`,'error');
  return false;
}

function cmdGo(rest){
  let target = rest, key = '';
  const m = rest.match(/^(.+?)\s+(con|diciendo|respondiendo)\s+(.+)$/i);
  if (m) { target = m[1].trim(); key = m[3].trim(); }

  const room = R[G.curr];
  const links = room.objs.filter(o => DOOR_TYPES.includes(o.t));
  const obj = findIn(links, target);
  if (!obj) {
    const other = findIn(room.objs, target);
    if (other) log(`«${other.name}» no es una salida.`,'error');
    else log(target ? `No existe «${target}» en este lugar.` : 'Complete la oración. No sea ambiguo.','error');
    return;
  }

  if (obj.t === 'riddlelink' && !obj._open) {
    if (!key) {
      log('Debe resolver este acertijo:','hint'); log(obj.riddle,'hint');
      log(`Trate: «abrir ${obj.name} respondiendo <respuesta>».`,'hint');
      return;
    }
    if (!tryOpen(obj, key, G.curr)) return;
  }

  if (!obj._open && obj.t !== 'openlink' && obj.t !== 'riddlelink') {
    if (key) {
      log('Usted se arrodilla, levanta los brazos y dice:','hint');
      log(key+'!!!','dialog');
      if (!tryOpen(obj, key, G.curr)) return;
    } else if (obj.t === 'link' && !obj.key) {
      setDoorOpen(G.curr, obj, true);
    } else if (obj.t === 'dangerlink' || obj.t === 'dangerlink2') {
      setDoorOpen(G.curr, obj, true);
    } else {
      log('OUCH! Usted se ha golpeado las narices.','error');
      log('Trate de abrir antes.','hint');
      return;
    }
  }

  if (obj.t === 'dangerlink' || obj.t === 'dangerlink2') {
    if (!moveTo(obj.dest)) return;
    const has = !!findIn(G.bag, obj.talisman);
    if (obj.t === 'dangerlink') {
      if (!has) { log('No debí cruzar desprotegido.','error'); die(); return; }
    } else {
      if (has) { log('Usted llevaba un objeto que le impidió cruzar.','error'); die(); return; }
    }
    if (obj.pc) log(obj.pc,'desc');
    return;
  }

  if (obj.pc) log(obj.pc,'desc');
  moveTo(obj.dest);
}

function moveTo(dest){
  if (G.dead) return false;
  if (!R[dest]) { log('Error: destino inválido.','error'); return false; }
  G.curr = dest;
  if (!G.visited.has(dest)) G.visited.add(dest);
  showRoom();
  return true;
}

function cmdTake(rest){
  if (norm(rest)==='TODO') { log('Mejor tome las cosas una a una.','error'); return; }
  const obj = findInRoom(rest);
  if (!obj || obj.t !== 'thing') {
    if (obj) log(`«${obj.name}» no es algo que pueda coger.`,'error');
    else log(rest ? `No existe «${rest}» en este lugar.` : 'Complete la oración. No sea ambiguo.','error');
    return;
  }
  const total = G.bag.reduce((s,i)=>s+(i.w||0),0);
  if (total + obj.w > MAX_WEIGHT) {
    log(obj.w > MAX_WEIGHT ? 'Usted no puede cargar con eso.' : 'Sería demasiado peso.','error');
    return;
  }
  R[G.curr].objs.splice(R[G.curr].objs.indexOf(obj),1);
  G.bag.push(obj);
  log('Ok.','success');
  renderInventory(); renderSVG();
}

function cmdDrop(rest){
  if (norm(rest)==='TODO') {
    if (!G.bag.length) { log('Usted no lleva nada consigo.','error'); return; }
    while (G.bag.length) R[G.curr].objs.push(G.bag.pop());
    log('Usted deja todas sus pertenencias en el suelo.','success');
    renderInventory(); renderSVG();
    return;
  }
  const obj = findInBag(rest);
  if (!obj) { log(rest ? `«${rest}» no está dentro de sus pertenencias.` : 'Complete la oración. No sea ambiguo.','error'); return; }
  G.bag.splice(G.bag.indexOf(obj),1);
  R[G.curr].objs.push(obj);
  log('Ok.','success');
  renderInventory(); renderSVG();
}

function cmdOpen(rest){
  let target = rest, key = '';
  const m = rest.match(/^(.+?)\s+(con|diciendo|respondiendo)\s+(.+)$/i);
  if (m) { target = m[1].trim(); key = m[3].trim(); }

  const room = R[G.curr];
  const links = room.objs.filter(o => DOOR_TYPES.includes(o.t));
  const obj = findIn(links, target);
  if (!obj) {
    const other = findIn(room.objs, target);
    if (other) log(`«${other.name}» no es una puerta.`,'error');
    else log(target ? `No existe «${target}» en este lugar.` : 'Complete la oración. No sea ambiguo.','error');
    return;
  }
  if (obj._open || obj.t === 'openlink') { log('No es necesario.','hint'); return; }
  if (key) { log('Usted se arrodilla, levanta los brazos y dice:','hint'); log(key+'!!!','dialog'); }
  if (tryOpen(obj, key, G.curr)) { log('Ok.','success'); renderSVG(); }
}

function cmdBreak(rest){
  let target = rest, weapon = '';
  const m = rest.match(/^(.+?)\s+con\s+(.+)$/i);
  if (m) { target = m[1].trim(); weapon = m[2].trim(); }

  const room = R[G.curr];
  const obj = findIn(room.objs.filter(o=>o.t==='hidden'), target);
  if (!obj) {
    const other = findIn(room.objs, target);
    if (other) log('Usted no puede romper eso.','error');
    else log(target ? `No existe «${target}» en este lugar.` : 'Complete la oración. No sea ambiguo.','error');
    return;
  }
  if (weapon && !findInBag(weapon)) { log(`«${weapon}» no está dentro de sus pertenencias.`,'error'); return; }
  if (eqWords(obj.breaker, weapon)) {
    log('CRASSSHHH!!!','success');
    log('¡Usted ha descubierto algo!','success');
    const idx = room.objs.indexOf(obj);
    room.objs.splice(idx,1);
    if (obj.reveals) room.objs.push(obj.reveals);
    renderSVG();
  } else {
    log('Usted trata, pero no lo consigue.','error');
  }
}

function cmdKill(rest){
  let target = rest, weapon = '';
  const m = rest.match(/^(.+?)\s+con\s+(.+)$/i);
  if (m) { target = m[1].trim(); weapon = m[2].trim(); }

  const room = R[G.curr];
  const npcs = room.objs.filter(o=>o.t==='troll' || o.t==='guard');
  const obj = findIn(npcs, target);
  if (!obj) {
    const other = findIn(room.objs, target);
    if (other) log('No puede matar a algo que nunca tuvo vida.','error');
    else log(target ? `No existe «${target}» en este lugar.` : 'Complete la oración. No sea ambiguo.','error');
    return;
  }
  if (weapon && !findInBag(weapon)) { log(`«${weapon}» no está dentro de sus pertenencias.`,'error'); return; }

  if (obj.t === 'troll') {
    log('AAAAARRRGGGGG!!!','error');
    room.objs.splice(room.objs.indexOf(obj),1);
    renderSVG(); checkGoal();
    return;
  }
  if (obj.t === 'guard') {
    if (eqWords(obj.lethalweap, weapon)) {
      if (obj.confession) log(obj.confession,'hint');
      room.objs.splice(room.objs.indexOf(obj),1);
      renderSVG(); checkGoal();
    } else {
      log('Todos sus esfuerzos son en vano. Probablemente no esté usando el objeto indicado.','error');
    }
  }
}

function cmdAsk(rest){
  const npcs = R[G.curr].objs.filter(o=>o.t==='troll' || o.t==='guard');
  const obj = findIn(npcs, rest);
  if (!obj) {
    const other = findIn(R[G.curr].objs, rest);
    if (other) log('¿Hablando solo?','error');
    else log(rest ? `«${rest}» no está aquí.` : 'Complete la oración. No sea ambiguo.','error');
    return;
  }
  if (obj.t === 'troll') log(obj._happy ? obj.hi : obj.lo, 'dialog');
  else log('No desea hablar con usted.','hint');
}

function cmdGive(rest){
  const idx = rest.search(/\s+a\s+/i);
  if (idx < 0) { log('Complete la oración. No sea ambiguo.','error'); return; }
  const what = rest.slice(0, idx).trim();
  const who  = rest.slice(idx).replace(/\s+a\s+/i,'').trim();

  const w = findInBag(what);
  if (!w) { log(`«${what}» no está dentro de sus pertenencias.`,'error'); return; }

  const room = R[G.curr];
  const obj = findIn(room.objs.filter(o=>o.t==='troll'), who);
  if (!obj) {
    const other = findIn(room.objs, who);
    if (other) log('Su regalo no es aceptado.','error');
    else log(`«${who}» no está aquí.`,'error');
    return;
  }
  const ok = eqWords(obj.wants, w.name);
  G.bag.splice(G.bag.indexOf(w),1);
  if (ok) {
    log('Muchas gracias. Hace mucho que esperaba por esto.','success');
    obj._happy = true;
    if (obj.hi) log(obj.hi,'dialog');
  } else {
    log('¡Qué amable! Gracias...','dialog');
  }
  renderInventory(); renderSVG(); checkGoal();
}

function cmdSee(rest){
  const obj = findInRoom(rest) || findInBag(rest);
  if (!obj) { log(rest ? `No existe «${rest}» en este lugar ni en sus pertenencias.` : 'Complete la oración. No sea ambiguo.','error'); return; }
  log(obj.desc || obj.name,'desc');
  if (obj.readable) log(obj.readable,'hint');
}

function cmdLook(){
  const room = R[G.curr];
  log(`Usted se encuentra en ${room.name}.`,'room');
  log(room.desc,'desc');
  if (room.objs.length) {
    log('Usted ve:','desc');
    room.objs.forEach(o => log('  · '+o.name,'desc'));
  }
}

function cmdInv(){
  if (!G.bag.length) { log('Usted no lleva nada consigo.','error'); return; }
  log('Sus pertenencias son:','desc');
  G.bag.forEach(o => log(`  · ${o.name} (${o.w||0})`,'desc'));
}

function cmdWeigh(rest){
  if (!findInBag('Balanza')) { log('Usted no trae la balanza.','error'); return; }
  const t = findInBag(rest) || findInRoom(rest);
  if (!t) { log(rest ? `No hay «${rest}» en este lugar.` : 'Complete la oración. No sea ambiguo.','error'); return; }
  log(`Usted coloca el objeto en el plato de la balanza. La aguja indica ${t.w||1} bolsa${(t.w||1)===1?'':'s'}.`,'desc');
}

function cmdPercent(){
  log(`Usted ha avanzado un ${Math.round(G.visited.size / TOTAL_ROOMS * 100)}%.`,'hint');
}

function cmdSave(){
  try {
    localStorage.setItem('fortaleza_save', JSON.stringify({
      curr: G.curr, bag: G.bag, visited: [...G.visited], dead: G.dead, rooms: R
    }));
    log('Partida salvada.','success');
  } catch(e) { log('Error al salvar: '+e.message,'error'); }
}

function cmdLoad(){
  const saved = localStorage.getItem('fortaleza_save');
  if (!saved) { log('No hay partida guardada.','error'); return; }
  try {
    const st = JSON.parse(saved);
    R = st.rooms;
    G = { curr:st.curr, bag:st.bag, visited:new Set(st.visited), dead:st.dead };
    ARMED = null;
    syncAllDoors();
    clearLog();
    log('Partida cargada.','success');
    showRoom();
  } catch(e) { log('Error al cargar: '+e.message,'error'); }
}

function cmdQuit(){ log('Usted se ha quitado la vida.','error'); die(); }
function cmdCls(){ clearLog(); }
function cmdPiss(){ log('Usted se asegura de que nadie está mirando y... Ah, ¡qué alivio!','dialog'); }

/* ═══════════════════════════════════════════════════════════════
   EJECUTOR
   ═══════════════════════════════════════════════════════════════ */
function execute(input){
  if (G.dead) { log('Lamento informarle que usted está muerto.','error'); return; }
  const p = parse(input);
  logSep();
  log('> '+input,'cmd');
  history.push(input); histIdx = -1;
  if (p.err==='vacio') return;
  if (p.verb === 'quit') { showConfirmTerminate(); return; }
  switch (p.verb) {
    case 'go':      return cmdGo(p.rest);
    case 'take':    return cmdTake(p.rest);
    case 'drop':    return cmdDrop(p.rest);
    case 'open':    return cmdOpen(p.rest);
    case 'kill':    return cmdKill(p.rest);
    case 'look':    return p.rest ? cmdSee(p.rest) : cmdLook();
    case 'see':     return cmdSee(p.rest);
    case 'break':   return cmdBreak(p.rest);
    case 'ask':     return cmdAsk(p.rest);
    case 'inv':     return cmdInv();
    case 'give':    return cmdGive(p.rest);
    case 'weigh':   return cmdWeigh(p.rest);
    case 'percent': return cmdPercent();
    case 'save':    return cmdSave();
	case 'load':    return showConfirmLoad();
    case 'cls':     return cmdCls();
    case 'piss':    return cmdPiss();
    case 'help':    return cmdHelp();
    default: log('No le comprendo.','error');
  }
}

/* ═══════════════════════════════════════════════════════════════
   COMANDOS ARMADOS
   ═══════════════════════════════════════════════════════════════ */
function setInput(v){ $('#cmd-input').value = v; }

function updateChipStates(){
  document.querySelectorAll('.chip[data-verb]').forEach(c => {
    c.classList.toggle('is-armed', !!ARMED && c.dataset.verb === ARMED.verb);
  });
}

function syncArmedInput(){
  if (!ARMED) { setInput(''); return; }
  const { verb, parts } = ARMED;
  let v = verb;
  if (parts.length >= 1) v += ' ' + parts[0];
  if (parts.length >= 2) v += ' ' + (CONNECTORS[verb] || '') + ' ' + parts[1];
  else if (parts.length === 1 && CONNECTORS[verb]) v += ' ' + CONNECTORS[verb] + ' ';
  else v += ' ';
  setInput(v);
}

function armVerb(verb){
  if (CONFIRM_VERBS.includes(verb)) { showConfirmTerminate(); return; }
  if (INSTANT_VERBS.includes(verb)) {
    if (ARMED) { ARMED = null; updateChipStates(); setInput(''); }
    execute(verb);
    return;
  }
  if (ARMED && ARMED.verb === verb) {
    ARMED = null; updateChipStates(); setInput('');
    return;
  }
  ARMED = { verb, parts: [] };
  syncArmedInput();
  updateChipStates();
  $('#cmd-input').focus();
}

function clickObject(obj, source){
  if (!ARMED) { execute('mirar ' + obj.name); return; }
  const v = ARMED.verb;
  if (v === 'coger' && source !== 'room') { log('No puede coger lo que ya tiene.','error'); return; }
  if (v === 'dejar' && source !== 'bag')  { log('Solo puede dejar lo que lleva consigo.','error'); return; }
  if (v === 'dar' && ARMED.parts.length === 0 && source !== 'bag') {
    log('Debe dar algo que lleve consigo.','error'); return;
  }
  if ((v === 'matar' || v === 'romper' || v === 'abrir') &&
      ARMED.parts.length === 1 && source !== 'bag') {
    log('El instrumento debe estar entre sus pertenencias.','error'); return;
  }
  if (ARMED.parts.includes(obj.name)) return;

  ARMED.parts.push(obj.name);
  syncArmedInput();

  const len = ARMED.parts.length;
  if (TWO_REQUIRED.includes(v) && len >= 2) return executeArmed();
  if (TWO_REQUIRED.includes(v)) return;
  if (TWO_OPTIONAL.includes(v) && len >= 2) return executeArmed();
  if (TWO_OPTIONAL.includes(v)) return;
  if (len >= 1) executeArmed();
}

function executeArmed(){
  if (!ARMED) return;
  const { verb, parts } = ARMED;
  let cmd = verb;
  if (parts.length >= 1) cmd += ' ' + parts[0];
  if (parts.length >= 2) cmd += ' ' + (CONNECTORS[verb] || '') + ' ' + parts[1];
  ARMED = null;
  updateChipStates();
  setInput('');
  execute(cmd);
}

  const centros = ['Centro de los pulmones','Centro del estomago','Centro del corazón','Centro del cerebro'];
  const ids = [19,20,21,22];
  for (let i=0;i<centros.length;i++) if (R[ids[i]].objs.find(o=>o.name===centros[i])) return;
  if (R[12].objs.find(o=>o.name==='Troll')) return;
  win();
}

/* ═══════════════════════════════════════════════════════════════
   SVG: PUERTAS, OBJETOS Y ESTADOS
   ═══════════════════════════════════════════════════════════════ */
const BG = {
  exterior:['#050510','#1a1a2e'],
  interior:['#12121f','#08080f'],
  organ:['#3a0a1a','#1a0510'],
  garden:['#0a1a0f','#050a05'],
  labyrinth:['#0a0a15','#050508']
};

function doorColor(name){
  const n = norm(name).toLowerCase();
  if (/negra|negro/.test(n))     return '#5a5a80';
  if (/azul/.test(n))            return '#3b82f6';
  if (/verde/.test(n))           return '#22c55e';
  if (/amarill/.test(n))         return '#eab308';
  if (/gris/.test(n))            return '#9ca3af';
  if (/roj/.test(n))             return '#dc2626';
  if (/dorad|oro/.test(n))       return '#fbbf24';
  if (/cristal/.test(n))         return '#93c5fd';
  if (/hierro/.test(n))          return '#9ca3af';
  if (/madera/.test(n))          return '#a16207';
  if (/tela/.test(n))            return '#a78bfa';
  if (/prohibid/.test(n))        return '#7c3aed';
  if (/vieja/.test(n))           return '#92400e';
  if (/secreta|oculta/.test(n))  return '#c084fc';
  return '#a0a0c0';
}

function renderSVG(){
  const room = R[G.curr];
  const W = 800, H = 560;
  const [c1, c2] = BG[room.svg] || BG.interior;

  const things  = room.objs.filter(o=>o.t==='thing');
  const npcs    = room.objs.filter(o=>o.t==='troll' || o.t==='guard');
  const hiddens = room.objs.filter(o=>o.t==='hidden');
  const links   = room.objs.filter(o => DOOR_TYPES.includes(o.t));

  let s = `<svg class="room-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
    </linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#bg)"/>
    <rect x="26" y="26" width="${W-52}" height="${H-52}" fill="none" stroke="#2a2a3f" stroke-width="2" rx="8"/>
    <text x="${W/2}" y="56" text-anchor="middle" fill="#8888a0" font-family="Georgia,serif" font-size="12" font-style="italic">${room.name}</text>`;

  const objRow = [...things, ...npcs, ...hiddens];
  if (objRow.length) {
    const cols = Math.min(4, objRow.length);
    const cw = 700 / cols;
    objRow.forEach((o, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x = 50 + col*cw + cw/2;
      const y = 140 + row*110;
      s += renderObjSVG(o, x, y);
    });
  }

  if (links.length) {
    const lw = 720 / links.length;
    links.forEach((o, i) => {
      const x = 40 + i*lw + lw/2;
      s += renderLinkSVG(o, x, 470);
    });
  }

  s += `</svg>`;
  $('#room-viewport').innerHTML = s;
  $('#room-viewport').querySelectorAll('.obj').forEach(el=>{
    el.addEventListener('click', e => {
      e.stopPropagation();
      const obj = findIn(R[G.curr].objs, el.dataset.name);
      if (!obj) return;
      if (ARMED) { clickObject(obj, 'room'); return; }
      const type = obj.t;
      if (DOOR_TYPES.includes(type)) execute('ir ' + obj.name);
      else if (type === 'troll')     execute('interrogar ' + obj.name);
      else                           execute('mirar ' + obj.name);
    });
  });
}

function renderObjSVG(o, x, y){
  let col = '#a0a0c0', icon = '◆';
  if (o.t === 'troll')       { col = o._happy ? '#4ade80' : '#f87171'; icon = '☺'; }
  else if (o.t === 'guard')  { col = '#f87171'; icon = '☠'; }
  else if (o.t === 'hidden') { col = '#fbbf24'; icon = '▣'; }
  return `<g class="obj" data-type="${o.t}" data-name="${o.name}" style="color:${col}">
    <circle cx="${x}" cy="${y}" r="28" fill="#0a0a15" stroke="${col}" stroke-width="2" ${o.t==='hidden'?'stroke-dasharray="4,3"':''}/>
    <text x="${x}" y="${y+8}" text-anchor="middle" fill="${col}" font-size="22">${icon}</text>
    <text x="${x}" y="${y+48}" text-anchor="middle" fill="${col}" font-size="11" font-family="Georgia,serif">${o.name}</text>
  </g>`;
}

function renderLinkSVG(o, x, y){
  const isOpen = (o.t === 'openlink') || o._open;
  const color  = doorColor(o.name);
  const isDoor = /puerta|escaparate/i.test(o.name);
  const W = 44, H = 70;
  const left = x - W/2, top = y - H/2, right = x + W/2, bot = y + H/2;
  const darker = shadeColor(color, -45);
  const lighter = shadeColor(color, 40);

  let s = `<g class="obj" data-type="${o.t}" data-name="${o.name}" style="color:${color}">`;

  if (isDoor) {
    s += `<rect x="${left}" y="${top}" width="${W}" height="${H}" fill="#0a0a15" stroke="${color}" stroke-width="2.5"/>`;
    if (isOpen) {
      s += `<rect x="${left+3}" y="${top+3}" width="${W-6}" height="${H-6}" fill="#050508"/>`;
      const lw = W * 0.34;
      s += `<polygon points="${left+3},${top+4} ${left+3+lw},${top+12} ${left+3+lw},${bot-12} ${left+3},${bot-4}" fill="${color}" stroke="${darker}" stroke-width="1.5"/>`;
      s += `<line x1="${left+6}" y1="${top+16}" x2="${left+3+lw-3}" y2="${top+18}" stroke="${lighter}" stroke-width="0.8" opacity="0.7"/>`;
      s += `<line x1="${left+6}" y1="${bot-18}" x2="${left+3+lw-3}" y2="${bot-16}" stroke="${darker}" stroke-width="0.8" opacity="0.5"/>`;
      s += `<circle cx="${left+3+lw-5}" cy="${y-2}" r="2.2" fill="#f0c46a" stroke="${darker}" stroke-width="0.5"/>`;
      s += `<text x="${right-9}" y="${y+6}" text-anchor="middle" fill="#4ade80" font-size="12" opacity="0.85">→</text>`;
    } else {
      s += `<rect x="${left+3}" y="${top+3}" width="${W-6}" height="${H-6}" fill="${color}" stroke="${darker}" stroke-width="1"/>`;
      s += `<line x1="${left+6}" y1="${top+9}" x2="${right-6}" y2="${top+9}" stroke="${lighter}" stroke-width="0.9" opacity="0.7"/>`;
      s += `<line x1="${left+6}" y1="${top+9}" x2="${left+6}" y2="${bot-6}" stroke="${lighter}" stroke-width="0.9" opacity="0.5"/>`;
      s += `<circle cx="${right-9}" cy="${y-2}" r="2.4" fill="#f0c46a" stroke="${darker}" stroke-width="0.5"/>`;
      if (o.key || o.t === 'riddlelink') {
        s += `<text x="${x}" y="${y+6}" text-anchor="middle" fill="#fbbf24" font-size="14">🔒</text>`;
      }
    }
  } else {
    const ico = isOpen ? '▶' : '◯';
    s += `<rect x="${left}" y="${top}" width="${W}" height="${H}" rx="6" fill="#0a0a15" stroke="${color}" stroke-width="2"/>`;
    s += `<text x="${x}" y="${y+8}" text-anchor="middle" fill="${color}" font-size="24">${ico}</text>`;
  }

  s += `<text x="${x}" y="${bot+16}" text-anchor="middle" fill="${color}" font-size="10" font-family="Georgia,serif">${o.name}</text>`;
  s += `</g>`;
  return s;
}

/* ═══════════════════════════════════════════════════════════════
   PANELES
   ═══════════════════════════════════════════════════════════════ */
function showRoom(){
  ARMED = null;
  updateChipStates();
  setInput('');
  const room = R[G.curr];
  $('#location-name').textContent = room.name;
  $('#room-title').textContent = room.name;
  $('#room-description').textContent = room.desc;
  renderSVG();
  renderInventory();
  updateStatus();
  cmdLook();
}

function renderInventory(){
  const ul = $('#inventory');
  if (!G.bag.length) {
    ul.innerHTML = '<li class="inv-empty">Vacío</li>';
  } else {
    ul.innerHTML = G.bag.map(o =>
      `<li class="inv-item" data-name="${o.name}">
         <span>${o.name}</span>
         <span class="inv-item__weight">${o.w||0}</span>
       </li>`).join('');
    ul.querySelectorAll('.inv-item').forEach(li => {
      li.addEventListener('click', () => {
        const obj = findInBag(li.dataset.name);
        if (!obj) return;
        if (ARMED) { clickObject(obj, 'bag'); return; }
        execute('mirar ' + obj.name);
      });
    });
  }
  const total = G.bag.reduce((s,i)=>s+(i.w||0),0);
  const left  = MAX_WEIGHT - total;
  $('#weight-fill').style.width = Math.min(100, total/MAX_WEIGHT*100)+'%';
  $('#weight-label').textContent = total+' / '+MAX_WEIGHT;
  let comment = '';
  if (G.bag.length > 0) {
    if (left === 0)      comment = 'Usted no puede ni con un átomo más.';
    else if (left === 1) comment = 'Usted está a punto de agotar sus capacidades.';
    else                 comment = `Usted podría cargar ${left} bolsas más.`;
  }
  $('#weight-comment').textContent = comment;
}

function updateStatus(){
  $('#status-mode').textContent = G.dead ? 'Muerto' : 'Normal';
  $('#status-progress').textContent = Math.round(G.visited.size / TOTAL_ROOMS * 100)+' % explorado';
}

La Bestia es una de las criaturas más temidas y misteriosas del universo. Habita un lugar llamado la Fortaleza, aunque hay quienes dicen que la Bestia y la Fortaleza son una misma cosa. Nadie ha visto a la Bestia (quienes lo hicieron no pudieron contarlo nunca).

Su misión es: adentrarse en la Fortaleza y matar a la Bestia. Nada más.

                                   Jefe de la Oficina de Casualidades"

function showConfirmTerminate(){
  ARMED = null; updateChipStates(); setInput('');
  showModal(`
    <div class="modal" id="modal-terminate"><div class="modal__inner">
      <h2 class="modal__title">Abandonar la empresa</h2>
      <div class="modal__text">«Los muros de la Fortaleza han visto a muchos hombres entrar. Pocos han salido. Y de los que salieron, ninguno volvió a ser el mismo.

Los valientes no huyen, pero los sabios saben cuándo la retirada es más digna que la carnicería. ¿Está usted seguro de que desea abandonar esta misión, dejando a la Bestia libre para seguir devorando?»

                                    — Consejos de un anciano que nunca entró</div>
      <div class="modal__actions">
        <button class="btn" onclick="document.getElementById('modal-terminate').remove()">No, seguiré luchando</button>
        <button class="btn btn--danger" onclick="confirmQuit()">Sí, deseo terminar</button>
      </div>
    </div></div>`);
}

function confirmQuit(){
  const m = document.getElementById('modal-terminate');
  if (m) m.remove();
  logSep();
  log('> terminar','cmd');
  history.push('terminar'); histIdx = -1;
  cmdQuit();
}

function showConfirmLoad(){
  if (!localStorage.getItem('fortaleza_save')) {
    log('No hay partida guardada.','error');
    return;
  }
  ARMED = null; updateChipStates(); setInput('');
  showModal(`
    <div class="modal" id="modal-loadconf"><div class="modal__inner">
      <h2 class="modal__title">Retornar al pasado</h2>
      <div class="modal__text">«Dentro de la Fortaleza el tiempo no fluye como en el mundo de los hombres. Lo que has vivido puede deshacerse; lo que has ganado, perderse; los muros que has derribado pueden alzarse de nuevo, como si nunca hubieran caído.

Cargar un rastro antiguo borrará de un soplo todo tu avance presente. Los muertos volverán a estar vivos, los vivos volverán a estar muertos, y tú olvidarás el camino que apenas empezabas a trazar.

¿Deseas realmente regresar a ese instante ya vivido?»

                                    — Advertencia grabada en la pared de la Antesala del Laberinto</div>
      <div class="modal__actions">
        <button class="btn" onclick="document.getElementById('modal-loadconf').remove()">No, continuaré mi camino</button>
        <button class="btn btn--primary" onclick="document.getElementById('modal-loadconf').remove(); cmdLoad()">Sí, deseo cargar la partida</button>
      </div>
    </div></div>`);
}

function showMapWarning(){
  showModal(`
    <div class="modal" id="modal-mapwarn"><div class="modal__inner">
      <h2 class="modal__title">Cartografía</h2>
      <div class="modal__text">«Tenga siempre lápiz y papel a mano. Vaya llevando un diagrama donde represente los distintos lugares que visite y las relaciones entre ellos (puertas, etc.). De no seguir esta regla puede perderse en la Fortaleza hasta el punto de no encontrar la forma de pararse de la silla y apagar la máquina.»

                                    — Consejos, Regla 3

El mapa que está a punto de consultar es un atajo indigno de un explorador metódico. Le mostrará las puertas que usted no ha descubierto y los lugares que aún no ha visitado, arrebatándole el placer del hallazgo. Muchos han perdido su alma por menos.

¿Desea verlo de todos modos?</div>
      <div class="modal__actions">
        <button class="btn" onclick="document.getElementById('modal-mapwarn').remove()">No, prefiero el desafío</button>
        <button class="btn btn--primary" onclick="document.getElementById('modal-mapwarn').remove(); showMap()">Sí, mostrar el mapa</button>
      </div>
    </div></div>`);
}

function showMap(){
  const rows = [];
  for (let i = 1; i <= TOTAL_ROOMS; i++) {
    const room = R[i];
    if (!room) continue;
    const isVisited = G.visited.has(i);
    const cls = isVisited ? 'map-room map-room--visited' : 'map-room map-room--unvisited';
    if (!isVisited) { rows.push(`<div class="${cls}">${i}. ${room.name} — (sin visitar)</div>`); continue; }
    const links = room.objs.filter(o => DOOR_TYPES.includes(o.t));
    const conn = links.map(l => {
      const known = G.visited.has(l.dest);
      const arrow = l._open ? '→' : '⇥';
      const label = known ? R[l.dest].name : '???';
      return `${arrow} ${l.dest} (${label})${l._open?'':' [cerrada]'}`;
    }).join(' · ') || 'sin salidas';
    rows.push(`<div class="${cls}"><strong>${i}. ${room.name}</strong><br><span style="color:var(--mute)">${conn}</span></div>`);
  }
  showModal(`
    <div class="modal" id="modal-map"><div class="modal__inner">
      <h2 class="modal__title">Mapa de la Fortaleza</h2>
      <p class="modal__sub">Habitaciones visitadas: ${G.visited.size} / ${TOTAL_ROOMS}</p>
      <div style="max-height:55vh;overflow-y:auto;background:var(--bg);padding:12px;border-radius:4px;border:1px solid var(--border)">${rows.join('')}</div>
      <div class="modal__actions">
        <button class="btn" onclick="document.getElementById('modal-map').remove()">Cerrar</button>
      </div>
    </div></div>`);
}

/* ═══════════════════════════════════════════════════════════════
   EVENTOS
   ═══════════════════════════════════════════════════════════════ */
function newGame(){
  initGame();
  clearLog();
  log('La Fortaleza — En las entrañas de la Bestia','room');
  log('Escriba "ayuda" o use los botones para empezar.','hint');
  showRoom();
}

$('#cmdbar').addEventListener('submit', e => {
  e.preventDefault();
  if (ARMED) {
    if (ARMED.parts.length >= 1) return executeArmed();
    if (ARMED.verb === 'mirar') {
      ARMED = null; updateChipStates(); setInput('');
      execute('mirar');
      return;
    }
    return;
  }
  const v = $('#cmd-input').value.trim();
  if (!v) return;
  execute(v);
  setInput('');
});

$('#cmd-input').addEventListener('input', () => {
  if (ARMED) { ARMED = null; updateChipStates(); }
});

document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => armVerb(c.dataset.verb));
});

$('#room-viewport').addEventListener('click', e => {
  if (e.target.closest('.obj')) return;
  if (ARMED) { ARMED = null; updateChipStates(); setInput(''); }
  execute('mirar');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ARMED) {
    ARMED = null; updateChipStates(); setInput('');
    e.preventDefault();
  }
});

$('#btn-help').addEventListener('click', showHelp);
$('#btn-map').addEventListener('click', showMapWarning);
$('#btn-save').addEventListener('click', cmdSave);
$('#btn-load').addEventListener('click', showConfirmLoad);
$('#btn-new').addEventListener('click', () => {
  if (confirm('¿Reiniciar partida? Se perderá el progreso.')) newGame();
});

$('#cmd-input').addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!history.length) return;
    if (histIdx < 0) histIdx = history.length;
    histIdx = Math.max(0, histIdx-1);
    setInput(history[histIdx]);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx < 0) return;
    histIdx++;
    if (histIdx >= history.length) { histIdx = -1; setInput(''); }
    else setInput(history[histIdx]);
  }
});

/* ═══════════════════════════════════════════════════════════════
   ARRANQUE
   ═══════════════════════════════════════════════════════════════ */
initGame();
showIntro();
</script>
